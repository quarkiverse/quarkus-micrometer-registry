#quarkus.log.category."io.quarkus.micrometer".level=DEBUG
quarkus.log.category."io.quarkus.bootstrap".level=INFO
quarkus.log.category."io.netty".level=INFO
quarkus.log.category."org.apache".level=INFO

# Required by the CloudWatch registry
quarkus.micrometer.export.cloudwatch.namespace=quarkus-micrometer-it
# Publish often so the tests do not have to wait for the default 1 minute step
quarkus.micrometer.export.cloudwatch.step=1s
